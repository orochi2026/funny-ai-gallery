<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funny AI Gallery</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    main {
      width: min(92vw, 900px);
      margin: 0 auto;
      padding: 32px 20px 48px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 6vw, 48px);
    }

    p {
      margin: 0 0 28px;
      color: #b8c1d9;
      font-size: 18px;
    }

    .poster-block {
      margin-top: 28px;
    }

    .poster-title {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
    }

    .poster {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
  </style>
</head>
<body>
  <main>
    <h1>Funny AI Gallery</h1>
    <p>AI 圖片 / 搞笑合成影片收藏</p>

    <div class="poster-block">
      <div class="poster-title">MEOL－跑跑卡陰車</div>
      <img
        class="poster"
        src="assets/kart-poster.png"
        alt="MEOL 跑跑卡陰車"
      />
    </div>

    <div class="poster-block">
      <div class="poster-title">人畜無害的 FEOL</div>
      <img
        class="poster"
        src="assets/feol-poster.png"
        alt="人畜無害的 FEOL"
      />
    </div>

    <div class="poster-block">
      <div class="poster-title">Defect 可以不解，但羽球不能不打得 BEOL</div>
      <img
        class="poster"
        src="assets/beol-badminton.png"
        alt="Defect 可以不解，但羽球不能不打得 BEOL"
      />
    </div>
  </main>
</body>
</html>
